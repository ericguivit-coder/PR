<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Classes dels components (el «components.css» de l'especificació). Només fan servir variables (--nom), que surten de TOKENS (secció 4 del
   motor): cap color escrit aquí. Els efectes «:hover» van dins @media(hover:hover). Sense ombres, menys als menús i avisos que suren (--pop). */
html,body{margin:0}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.mtp{font-family:'Inter',ui-sans-serif,-apple-system,system-ui,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg)}
.mtp *,.mtp *::before,.mtp *::after{box-sizing:border-box}
.mtp button,.mtp input,.mtp select{font:inherit;color:inherit}
.mtp .num,.mtp table{font-variant-numeric:tabular-nums}
.mtp :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mtp h1{margin:0;font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.mtp h2{margin:0;font-size:16px;font-weight:600;line-height:1.35}
.mtp .t-sec{font-size:13px;color:var(--text2)}
.mtp .t-lab{font-size:12px;font-weight:500;color:var(--text2)}
.mtp .t-big{font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.mtp .t-name{font-weight:500}
.mtp a{color:var(--link)}
.mtp-ic{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* Estat: punt + text (el text, sempre del color del text). Cel·la: el dia a la matriu i als 7 dies. F = dia que no ha arribat: buit i sense vora. */
.mtp-st{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--text)}
.mtp-dot{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%}
.mtp-cell{display:inline-block;flex:none;width:16px;height:16px;border-radius:4px}
.mtp-dot[data-s=O],.mtp-cell[data-s=O]{background:var(--opt);box-shadow:inset 0 0 0 1px var(--stEdge)}
.mtp-dot[data-s=M],.mtp-cell[data-s=M]{background:var(--mod);box-shadow:inset 0 0 0 1px var(--stEdge)}
.mtp-dot[data-s=R],.mtp-cell[data-s=R]{background:var(--rec);box-shadow:inset 0 0 0 1px var(--stEdge)}
.mtp-dot[data-s=C],.mtp-cell[data-s=C]{background:var(--calc);border:1px dashed var(--miss)}
.mtp-dot[data-s=N],.mtp-cell[data-s=N]{border:1.5px dashed var(--miss)}
/* Ajust: icona + text, fons gris clar. Pendent: àmbar. «Normal» sense res a decidir: text gris, sense xip. */
.mtp-aj{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;background:var(--ajBg);color:var(--ajText);font-size:13px;font-weight:500;white-space:nowrap}
.mtp-aj .mtp-ic{color:var(--ajIcon)}
.mtp-pend{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:var(--pendBg);color:var(--pendText);box-shadow:inset 0 0 0 1px var(--pendLine);font-size:13px;font-weight:500;white-space:nowrap}
.mtp-plain{font-size:13px;color:var(--text2)}
/* Marca de salut (a part de l'estat) i punt blau de «nou d'avui» */
.mtp-health{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.mtp-health .mtp-ic{color:var(--icon)}
.mtp-new{display:inline-block;flex:none;width:6px;height:6px;border-radius:50%;background:var(--primary)}
/* Botons: principal (un per zona), secundari, terciari (només text blau) i només icona (sempre amb títol i aria-label). 36 px; 32 a les taules.
   Els espais, en múltiples de 4 px (4, 8, 12, 16, 24, 32, 48), com diu l'especificació. */
.mtp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text);font-size:14px;font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer;transition:background-color .12s,border-color .12s}
.mtp-btn.sm{height:32px;padding:0 12px;font-size:13px}
.mtp-btn.pri{background:var(--primary);color:var(--onPrimary)}
.mtp-btn.sec{background:var(--surface);border-color:var(--borderStrong);color:var(--text)}
.mtp-btn.ter{padding:0 6px;color:var(--link)}
.mtp-btn.icon{width:36px;padding:0}
.mtp-btn.icon.sm{width:32px}
.mtp-btn:disabled{opacity:.45;cursor:not-allowed}
@media(hover:hover){.mtp-btn.pri:not(:disabled):hover{background:var(--primaryHover)}.mtp-btn.sec:not(:disabled):hover,.mtp-btn.icon:not(.pri):not(:disabled):hover{background:var(--hover)}.mtp-btn.ter:not(:disabled):hover{text-decoration:underline;text-underline-offset:3px}}
/* Control segmentat dels quatre ajustos: el suggerit per la IA, amb vora discontínua i «Suggerit». */
.mtp-seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--sunken);border:1px solid var(--border)}
.mtp-seg button{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 8px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.mtp-seg button[aria-checked=true]{background:var(--surface);color:var(--text);border-color:var(--borderStrong)}
.mtp-seg button[data-sug]{border-style:dashed;border-color:var(--primary)}
.mtp-seg .sug{margin-left:4px;font-size:11px;font-weight:500;color:var(--link)}
@media(hover:hover){.mtp-seg button:not([aria-checked=true]):hover{color:var(--text)}}
/* Taula */
.mtp-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.mtp-table th{padding:10px 16px;text-align:left;font-size:12px;font-weight:500;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}
.mtp-table td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.mtp-table tr:last-child td{border-bottom:0}
@media(hover:hover){.mtp-table tbody tr:hover td{background:var(--hover)}}
/* Avís de confirmació amb Desfer (a baix a l'esquerra, 10 s) */
.mtp-toast{display:inline-flex;align-items:center;gap:12px;padding:4px 4px 4px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--pop);font-size:14px;color:var(--text)}
.mtp-toast.fixed{position:fixed;left:24px;bottom:24px;z-index:80;animation:mtpIn .2s ease-out both}
@keyframes mtpIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Estat buit i càrrega (blocs grisos amb la forma del contingut; un fos suau, sense brillantor) */
.mtp-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 24px;text-align:center}
.mtp-empty .mtp-ic{color:var(--icon);margin-bottom:4px}
.mtp-skel{display:block;flex:none;background:var(--skel);border-radius:6px;animation:mtpPulse 1.6s ease-in-out infinite}
@keyframes mtpPulse{0%,100%{opacity:1}50%{opacity:.5}}
/* Avís àmbar: dades de fa més de 2 hores o error de sincronització */
.mtp-warn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--warnText)}
/* Llegenda: només a la vista Setmana d'Esportistes (decisió de l'usuari, fase 2) */
.mtp-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:12px;color:var(--text2)}
.mtp-legend>span{display:inline-flex;align-items:center;gap:8px}
/* Camps */
.mtp-input{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--borderStrong);background:var(--surface);color:var(--text);font-size:14px}
.mtp-input::placeholder{color:var(--text2)}
.mtp-kbd{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;color:var(--text2)}
/* Estructura (fase 3): barra lateral (224 px; plegada, 64 px només amb icones, sempre amb el nom en passar-hi el ratolí) + barra de dalt + la pàgina,
   que és l'única que fa scroll. Només ordinador (1280 px o més). Els menús i el panell de l'assistent suren (--pop). */
.mtp-shell{display:flex;height:100vh;overflow:hidden}
.mtp-side{display:flex;flex-direction:column;gap:4px;width:224px;flex:none;height:100vh;padding:12px;border-right:1px solid var(--border);background:var(--surface)}
.mtp-side.folded{width:64px;padding:12px 10px;align-items:center}
.mtp-brand{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:40px;padding-left:8px;margin-bottom:8px}
.mtp-side.folded .mtp-brand{justify-content:center;padding-left:0}
.mtp-brand b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.mtp-nav{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--text);font-size:14px;font-weight:500;text-align:left;text-decoration:none;cursor:pointer;white-space:nowrap}
.mtp-nav .mtp-ic{color:var(--icon)}
.mtp-nav[aria-current=page]{background:var(--primarySoft);color:var(--link)}
.mtp-nav[aria-current=page] .mtp-ic{color:var(--link)}
.mtp-side.folded .mtp-nav{width:44px;padding:0;justify-content:center}
@media(hover:hover){.mtp-nav:not([aria-current=page]):hover{background:var(--hover)}}
.mtp-count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pendBg);color:var(--pendText);box-shadow:inset 0 0 0 1px var(--pendLine);font-size:12px;font-weight:600;line-height:20px;text-align:center}
.mtp-side.folded .mtp-count{position:absolute;top:0;right:0;min-width:16px;height:16px;padding:0 4px;font-size:11px;line-height:16px}
.mtp-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;height:100vh}
.mtp-top{position:relative;z-index:30;display:flex;align-items:center;gap:16px;height:56px;flex:none;padding:0 32px;border-bottom:1px solid var(--border);background:var(--surface)}
.mtp-scroll{flex:1;min-height:0;overflow-y:auto}
.mtp-page{max-width:1440px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:24px}
.mtp-pop{position:absolute;z-index:50;padding:4px;border-radius:8px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--pop)}
.mtp-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:36px;padding:8px 12px;border:0;border-radius:6px;background:transparent;color:var(--text);font-size:14px;text-align:left;cursor:pointer}
.mtp-opt[aria-selected=true]{background:var(--hover)}
@media(hover:hover){.mtp-opt:not(:disabled):hover{background:var(--hover)}}
.mtp-fab{position:fixed;right:24px;bottom:24px;z-index:60;width:44px;height:44px;border:0;border-radius:12px;background:var(--primary);color:var(--onPrimary);display:flex;align-items:center;justify-content:center;box-shadow:var(--pop);cursor:pointer}
@media(hover:hover){.mtp-fab:hover{background:var(--primaryHover)}}
.mtp-drawer{position:fixed;top:0;right:0;bottom:0;z-index:70;width:400px;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--pop);animation:mtpSlide .2s ease-out both}
@keyframes mtpSlide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.mtp-toast.fixed{left:calc(var(--sideW, 0px) + 24px)}
/* Els enllaços que fan de menú (barra lateral, opcions) van del color del text, no del blau dels enllaços; l'actiu, en blau. */
.mtp a.mtp-nav,.mtp a.mtp-opt{color:var(--text)}
.mtp a.mtp-nav[aria-current=page]{color:var(--link)}
/* Avui (fase 4): dues columnes (pendents, 2/3; estat de l'equip, resum i propers, 1/3), targetes de sessió, el component de decisió i els blocs plegats. */
.mtp-hoy{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:32px;align-items:start}
.mtp-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.mtp-card-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.mtp-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.mtp-dec{display:flex;flex-direction:column;gap:12px;padding:16px;border-top:1px solid var(--border);cursor:pointer}
.mtp-card-h+.mtp-dec{border-top:0}
.mtp-dec.compact{gap:8px;padding:12px 16px;cursor:default}
.mtp-dec[data-focus]{box-shadow:inset 3px 0 0 var(--primary)}
@media(hover:hover){.mtp-dec:not(.compact):hover{background:var(--hover)}}
.mtp-sum{display:flex;flex-direction:column;gap:16px;padding:16px;border-radius:8px;background:var(--sunken);cursor:default}
.mtp-progress{display:inline-block;width:120px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.mtp-progress>span{display:block;height:100%;border-radius:3px;background:var(--primary);transition:width .3s}
.mtp-dist{display:flex;gap:2px;height:8px}
.mtp-dist>span{min-width:4px;border-radius:2px}
.mtp-dist>span[data-s=O]{background:var(--opt)}.mtp-dist>span[data-s=M]{background:var(--mod)}.mtp-dist>span[data-s=R]{background:var(--rec)}.mtp-dist>span[data-s=X]{border:1px dashed var(--miss)}
.mtp-fold{border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden}
.mtp-fold-h{flex:1;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:0;background:transparent;color:var(--text);font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.mtp-fold-h .mtp-ic{color:var(--icon);transition:transform .15s}
.mtp-fold-h[aria-expanded=true] .mtp-ic{transform:rotate(90deg)}
@media(hover:hover){.mtp-fold-h:hover{background:var(--hover)}}
.mtp-btn[aria-pressed=true]{background:var(--primarySoft);border-color:transparent;color:var(--link)}
@media (prefers-reduced-motion:reduce){.mtp *,.mtp *::before,.mtp *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</helmet>
<div style="{{ rootSt }}">{{ tokens }}{{ page }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
// Max Tracking · panell del preparador físic, VERSIÓ NOVA (en construcció des del 06-10-2026).
// Segueix l'especificació del Drive «Panel del preparador · Especificación de rediseño UX/UI» (id 1nCFHR7yVxmkK2QNVrSmprj8dCFIlG2csksRjq-zKmKw),
// fase per fase. El panell actual («Max Tracking Panel.dc.html») no es toca fins que l'usuari aprovi aquest; llavors aquest el substitueix.
// Fet: fase 1 (les dades i els càlculs), fase 2 (el sistema visual) i fase 3 (la navegació: barra lateral, barra de dalt, adreces i l'assistent).
// Les pantalles (Avui, Esportistes, la fitxa, Sessions, Ajustos) arriben a les fases 4 a 8; fins llavors surten «en construcció».
// Al matràs hi ha dues pàgines del prototip, en castellà: #/estilos (tots els components en clar i en fosc) i #/comprobacion (les xifres).
// Seccions del motor (fan dels fitxers de l'especificació):
//   1. Dades: l'única font. És el que vindria de la base de dades, de TrainingPeaks i de les polseres (el «data.js»).
//   2. Càlculs: funcions pures que en treuen tot el derivat: l'estat de l'equip, els pendents, els automàtics, a vigilar, els decidits,
//      els recomptes dels filtres i el resum de la setmana (el «state.js»). Cap xifra no s'escriu a mà enlloc més.
//   3. Desar: les decisions d'avui a localStorage, amb desfer.
//   4. Sistema visual: els colors en variables (el «tokens.css») i les icones. Les classes dels components són a dalt, al helmet («components.css»).
//   5. Textos: quatre idiomes (ca, es, fr, en); el preparador treballa en francès.
//   6. Component: les pantalles.
// Regles de l'estudi que manen per sobre de l'especificació: la IA suggereix i el preparador decideix; la IA rep codis, mai noms; el preparador
// només veu la matriu prudent (mai la salut mental, el que l'esportista va dir a l'entrenador —H2—, qui no ha respost —H4—, les paraules,
// el comentari ni el benestar mensual). Decisions de l'usuari: cap botó per confirmar en bloc (H1); els estats són els de l'app del deportista
// i la lesió o la malaltia va a part, sense «Precaució»; l'Experiment (H1) es queda, fora del menú (fase 0). Un sol estil, el de l'especificació,
// en clar, fosc i automàtic; un color fix per estat; llegenda només a la vista Setmana d'Esportistes (fase 2).
const h = React.createElement;
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const hmMin = s => { const [hh, mm] = String(s).split(':').map(Number); return hh * 60 + mm; };
const minHm = m => { m = Math.round(m); return `${Math.floor(m / 60)}:${String(((m % 60) + 60) % 60).padStart(2, '0')}`; };

// ── 1. Dades ─────────────────────────────────────────────────────────────
// Dies: índex 0 = dv. 28 d'agost de 2026 … 27 = dj. 24 de setembre, avui (com a l'app del deportista). Abans del 0, negatius.
// La setmana 39 va de dl. 21 (24) a dg. 27 (30). El formulari setmanal s'envia el diumenge: el de la setmana 38, el dg. 20 (23).
const TODAY = 27;
const MIN_DAYS = 14;                         // dies de dades que calen per tenir franja (com a l'app del deportista)
const FORM = { w: 38, day: 23, next: 30 };   // últim formulari setmanal respost i el proper
// Darrera importació de cada font (dia, hora): TrainingPeaks (sessions) i les polseres (FC, HRV i son).
const FEED = { tp: [27, '7:30'], band: [27, '8:05'] };
// Regles dels pendents (es podran canviar a Ajustos): dies seguits fora del seu normal, dies de tornada d'una lesió que es vigilen,
// minuts abans de la sessió per decidir (hora límit) i l'hora del resum per correu. Són la proposta de l'especificació: falta parlar-ne amb el preparador.
const RULES0 = { outDays: 2, backDays: 7, leadMin: 60, digest: '7:30', notifyLate: true, webNotif: false };
// Hora simulada del prototip a l'obrir (avui és un dia fix; l'hora avança amb el rellotge real). Amb l'hora real, a la tarda no quedaria res per decidir.
const CLOCK0 = '8:30';

// Esportistes (20, grups A i B). Martí R. és MT-07, el mateix codi que a l'app del deportista; Nora G. (MT-19) és la nova.
// d = estat dels 7 últims dies (dv. 18 → dj. 24) frente a la seva franja: O Òptim, M Moderat, R Recuperació, N sense dades, C calculant.
//     Són els estats de l'app del deportista; la lesió o la malaltia no és un estat, va a part (salut).
// q = avui, distància de la FC en repòs, la HRV i el son a la seva franja (en mitges franges; positiu = millor; per sota de −1, fora).
// calc = dies de dades d'un esportista nou. salut = lesió (les) o malaltia (mal) del formulari setmanal: des = des de quin dia, fi = dia que
//     el formulari ja no la marca (s'ha acabat), aj = l'ajust que diu la fitxa de salut amb participació reduïda. Mai la salut mental.
// part = participació (OSTRC) de les setmanes 35–38: 0 completa · 1 completa amb problemes · 2 reduïda · 3 no pot participar.
// f = formulari de la setmana 38 (matriu prudent): rendiment, la seva normal, fatiga, normal, descans, normal.
// sync = darrera sincronització de la polsera dels qui avui no tenen dades. note = nota de l'especialista. well = dia que va marcar «Ja estic bé».
const ATH = [
  { c: 'MT-01', n: 'Pol S.', g: 'A', d: 'OOOMRRR', q: [-2.2, -1.9, -1.1], salut: { t: 'mal', des: 23 }, part: [0, 0, 0, 3], f: [4, 7.0, 9, 4.6, 4, 7.2] },
  { c: 'MT-07', n: 'Martí R.', g: 'A', d: 'OOMMRRR', q: [-2.0, -1.6, -1.3], f: [6, 7.3, 8, 4.4, 5, 7.1], note: 'marti' },
  { c: 'MT-03', n: 'Laia P.', g: 'B', d: 'OOOOOOO', q: [.2, .1, -.3], salut: { t: 'les', des: 22, aj: 'A' }, part: [0, 0, 0, 2], f: [5, 7.4, 5, 4.8, 7, 7.0] },
  { c: 'MT-04', n: 'Júlia M.', g: 'B', d: 'OOOOOMO', q: [.3, .2, .1], salut: { t: 'les', des: -4, fi: 23, aj: 'A' }, part: [2, 2, 1, 0], f: [6, 7.1, 5, 4.9, 7, 7.2], note: 'julia' },
  { c: 'MT-05', n: 'Biel C.', g: 'A', d: 'OOOOOMM', q: [-.6, -1.2, .1], f: [7, 7.2, 5, 4.5, 6, 7.0] },

// ── 2. Càlculs (funcions pures: reben les dades i en tornen el derivat) ──
const KEYS3 = ['rhr', 'hrv', 'son'];

// Sèries inventades de 28 dies amb la franja de cadascú (la seva mitjana ± 1 desviació típica, amb l'amplada mínima FLOOR).

const SERIES = {};
function seriesOf(a) {

  const half = { rhr: Math.max(1.4 + r() * .9, FLOOR.rhr), hrv: Math.max(3.5 + r() * 3, FLOOR.hrv), son: Math.max(.22 + r() * .14, FLOOR.son) };

    if (i < first) { st.push(null); KEYS3.forEach(k => qs[k].push(null)); continue; }

    if (i < 21) { const mod = !a.calc && r() < .12; c = a.calc ? 'C' : mod ? 'M' : 'O'; if (mod) out1 = KEYS3[Math.floor(r() * 3)]; }

// Estat del dia i (null = encara no en tenia dades, o és un dia que no ha arribat).
function stOn(a, i) { return i >= 0 && i <= TODAY ? seriesOf(a).st[i] : null; }

function bandReady(a) { return a.calc ? TODAY + (MIN_DAYS - a.calc) : null; }

// Què ha de fer el preparador amb un esportista el dia i. Regles de l'especificació («Cuándo se crea un pendiente»), amb els llindars de R:
//   pend = pendent (ha de triar l'ajust) · auto = ajust automàtic (v; es pot canviar) · watch = a vigilar, sense tasca

// Quan hi caben dues regles, mana la primera. Sense sessió (descans) mai no hi ha tasca: si va malament, «a vigilar».
// «Moderat i la IA suggereix Normal» rebaixa a «a vigilar» el cas de dies seguits fora del seu normal: amb les dades d'avui dona

  if (h && a.well != null && i >= a.well) return { kind: 'pend', ses, sug, m: { t: 'well', h } };
  if (h && h.ost === 3) return { kind: 'auto', ses, sug, v: 'D', m: { t: 'salut', h } };
  if (h && h.ost === 2) return { kind: 'auto', ses, sug, v: h.aj, m: { t: 'salut', h } };

const LISTED = ['pend', 'auto', 'watch'];
// Tauler d'avui: per a cada esportista, què diuen les regles i què s'ha decidit (store = decisions d'avui). Tot el que es compta surt d'aquí.
//   status: pend (falta decidir) · nodec (la sessió ja ha començat sense decisió: «Sense decidir») · done (confirmat pel preparador)

// Recomptes (Avui, la barra lateral i els filtres d'Esportistes surten tots d'aquí, i per això sempre coincideixen).

// Pròxima hora límit: la de la sessió d'avui amb pendents que s'ha de decidir abans.

// L'ajust que va tenir (o té) un esportista el dia i: null = sense sessió, dia que no ha arribat o pendent avui.
