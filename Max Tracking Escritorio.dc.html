      normal: {
        titular: { ca: 'Recuperat, tot i dormir una mica menys', es: 'Recuperado, aunque has dormido algo menos', fr: 'Récupéré, malgré un peu moins de sommeil', en: 'Recovered, despite a little less sleep' },
        texto: { ca: "Avui el teu cos arriba [[descansat|+]]. El cor et batega més tranquil que de costum en repòs, i això sol voler dir que t'has recuperat bé de l'entrenament. La HRV, que indica com de recuperat està el teu cos, és al teu nivell de sempre. L'únic a millorar és el son: aquesta nit has dormit [[uns 40 minuts menys|~]] del que acostumes. Avui no és res preocupant, però si es repeteix unes quantes nits ho notaràs.", es: "Hoy tu cuerpo llega [[descansado|+]]. Tu corazón late más tranquilo que de costumbre en reposo, y eso suele querer decir que te has recuperado bien del entrenamiento. La HRV, que indica lo recuperado que está tu cuerpo, está en tu nivel de siempre. Lo único a mejorar es el sueño: anoche dormiste [[unos 40 minutos menos|~]] de lo que sueles. Hoy no es nada preocupante, pero si se repite varias noches lo notarás.", fr: "Aujourd'hui, ton corps arrive [[reposé|+]]. Ton cœur bat plus calmement que d'habitude au repos, ce qui veut souvent dire que tu as bien récupéré de l'entraînement. La HRV, qui indique à quel point ton corps a récupéré, est à ton niveau habituel. Le seul point à améliorer, c'est le sommeil : cette nuit, tu as dormi [[environ 40 minutes de moins|~]] que d'habitude. Rien d'inquiétant aujourd'hui, mais si ça se répète plusieurs nuits, tu le sentiras.", en: "Today your body arrives [[well rested|+]]. Your heart is beating more calmly than usual at rest, which usually means you've recovered well from training. Your HRV, which shows how recovered your body is, is at its usual level. The one thing to improve is sleep: last night you slept [[about 40 minutes less|~]] than you normally do. Nothing to worry about today, but if it happens several nights in a row you'll feel it." },
        estrategies: [{ a: 'son', t: { ca: "Avança 30 minuts l'hora d'anar a dormir", es: "Adelanta 30 minutos la hora de dormir", fr: "Avance ton coucher de 30 minutes", en: "Go to bed 30 minutes earlier" }, w: { ca: "Aquesta nit has dormit 40 min menys que la teva mitjana; recuperar-ho evita arrossegar cansament.", es: "Anoche dormiste 40 min menos que tu media; recuperarlo evita arrastrar cansancio.", fr: "Tu as dormi 40 min de moins que ta moyenne ; les récupérer évite d'accumuler la fatigue.", en: "You slept 40 min less than your average; making it up avoids carrying fatigue over." } }, { a: 'carga', t: { ca: "Fes la sessió prevista amb normalitat", es: "Haz la sesión prevista con normalidad", fr: "Fais la séance prévue normalement", en: "Do your planned session as normal" }, w: { ca: "La FC en repòs i la HRV indiquen que estàs recuperat.", es: "La FC en reposo y la HRV indican que estás recuperado.", fr: "La FC au repos et la HRV indiquent que tu as récupéré.", en: "Your resting HR and HRV show you have recovered." } }, { a: 'mob', t: { ca: "10 minuts de mobilitat suau després d'entrenar", es: "10 minutos de movilidad suave después de entrenar", fr: "10 minutes de mobilité douce après l'entraînement", en: "10 minutes of gentle mobility after training" }, w: { ca: "Ajuda a recuperar sense afegir càrrega.", es: "Ayuda a recuperar sin añadir carga.", fr: "Aide à récupérer sans ajouter de charge.", en: "Helps recovery without adding load." } }],
        resum: { ca: 'Les dades del cor diuen que el cos està descansat; només el son queda una mica curt.', es: 'Los datos del corazón dicen que el cuerpo está descansado; solo el sueño se queda algo corto.', fr: 'Les données cardiaques disent que ton corps est reposé ; seul le sommeil est un peu court.', en: 'Your heart data say your body is rested; only your sleep falls a little short.' },
        troballes: [
          { k: 'rhr', to: 'be', t: { ca: 'Més baixa que el teu normal: el cos està descansat.', es: 'Más baja que tu normal: el cuerpo está descansado.', fr: 'Plus basse que ta normale : ton corps est reposé.', en: 'Lower than usual: your body is rested.' } },
          { k: 'hrv', to: 'be', t: { ca: 'Dins la teva franja, en la línia dels últims dies.', es: 'Dentro de tu franja, en la línea de los últimos días.', fr: 'Dans ta plage, comme ces derniers jours.', en: 'Within your range, in line with recent days.' } },
          { k: 'son', to: 'vigilar', t: { ca: 'La nit més curta de la setmana.', es: 'La noche más corta de la semana.', fr: 'La nuit la plus courte de la semaine.', en: 'The shortest night of the week.' } }],
        accions: [{ ca: 'Entrena amb normalitat.', es: 'Entrena con normalidad.', fr: 'Entraîne-toi normalement.', en: 'Train as normal.' },
          { ca: 'Aquesta nit, intenta anar a dormir mitja hora abans.', es: 'Esta noche, intenta irte a dormir media hora antes.', fr: 'Ce soir, essaie de te coucher une demi-heure plus tôt.', en: 'Tonight, try going to bed half an hour earlier.' }] },
      descans: {
        titular: { ca: 'El cos et demana un dia de recuperació', es: 'El cuerpo te pide un día de recuperación', fr: 'Ton corps te demande une journée de récupération', en: 'Your body is asking for a recovery day' },
        texto: { ca: "Avui el teu cos et demana [[un respir|!]]. El cor et batega força més ràpid del normal en repòs i va pujant des de dilluns, i la HRV és al punt [[més baix de les últimes sis setmanes|!]]. A més, tu també notes que no estàs bé, així que tot apunta en la mateixa direcció. El son és l'únic que aguanta. Pren-t'ho com un dia per recarregar i parla'n amb el teu entrenador.", es: "Hoy tu cuerpo te está pidiendo [[un respiro|!]]. Tu corazón late bastante más rápido de lo normal en reposo y lleva subiendo desde el lunes, y la HRV está en el punto [[más bajo de las últimas seis semanas|!]]. Además, tú también notas que no estás bien, así que todo apunta en la misma dirección. El sueño es lo único que aguanta. Tómatelo como un día para recargar y coméntalo con tu entrenador.", fr: "Aujourd'hui, ton corps te demande [[une pause|!]]. Ton cœur bat nettement plus vite que d'habitude au repos et monte depuis lundi, et ta HRV est à son [[niveau le plus bas depuis six semaines|!]]. En plus, toi aussi tu sens que ça ne va pas, donc tout va dans le même sens. Le sommeil est la seule chose qui tient. Prends cette journée pour recharger les batteries et parles-en à ton entraîneur.", en: "Today your body is asking you for [[a break|!]]. Your heart is beating quite a bit faster than usual at rest and has been rising since Monday, and your HRV is at its [[lowest point in six weeks|!]]. On top of that, you also feel you're not well, so everything points the same way. Sleep is the only thing holding up. Treat today as a day to recharge, and talk it over with your coach." },
        estrategies: [{ a: 'carga', t: { ca: "Canvia la sessió per recuperació activa: 20–30 min molt suau", es: "Cambia la sesión por recuperación activa: 20–30 min muy suave", fr: "Remplace la séance par de la récupération active : 20–30 min très doux", en: "Swap the session for active recovery: 20–30 min very easy" }, w: { ca: "La FC en repòs alta i la HRV baixa indiquen que el cos encara no ha assimilat la càrrega.", es: "La FC en reposo alta y la HRV baja indican que el cuerpo aún no ha asimilado la carga.", fr: "Une FC au repos élevée et une HRV basse montrent que ton corps n'a pas encore assimilé la charge.", en: "High resting HR and low HRV show your body hasn't absorbed the load yet." } }, { a: 'son', t: { ca: "Dorm 8–9 hores aquesta nit i, si pots, fes una migdiada de 20 minuts", es: "Duerme 8–9 horas esta noche y, si puedes, echa una siesta de 20 minutos", fr: "Dors 8 à 9 heures cette nuit et, si tu peux, fais une sieste de 20 minutes", en: "Sleep 8–9 hours tonight and, if you can, take a 20-minute nap" }, w: { ca: "El son és el que més accelera la recuperació.", es: "El sueño es lo que más acelera la recuperación.", fr: "Le sommeil est ce qui accélère le plus la récupération.", en: "Sleep is what speeds up recovery the most." } }, { a: 'com', t: { ca: "Parla amb el teu entrenador abans d'entrenar", es: "Habla con tu entrenador antes de entrenar", fr: "Parle à ton entraîneur avant de t'entraîner", en: "Talk to your coach before training" }, w: { ca: "Tu també notes que no estàs bé; és important que ho sàpiga per ajustar el pla.", es: "Tú también notas que no estás bien; es importante que lo sepa para ajustar el plan.", fr: "Toi aussi tu sens que ça ne va pas ; il est important qu'il le sache pour adapter le plan.", en: "You also feel you're not well; it's important they know so they can adjust the plan." } }],
        resum: { ca: "La FC en repòs puja, l'HRV baixa i tu també dius que no et trobes bé.", es: 'La FC en reposo sube, la HRV baja y tú también dices que no te encuentras bien.', fr: 'La FC au repos monte, la HRV baisse et tu dis aussi que tu ne te sens pas bien.', en: "Your resting HR is up, your HRV is down and you also say you don't feel well." },
        troballes: [
          { k: 'rhr', to: 'vigilar', d: [38, 39, 40, 41], t: { ca: 'Puja cada dia des de dilluns i avui queda ben per sobre del teu normal.', es: 'Sube cada día desde el lunes y hoy queda muy por encima de tu normal.', fr: "Elle monte chaque jour depuis lundi et aujourd'hui elle est bien au-dessus de ta normale.", en: "It has risen every day since Monday and today it's well above your usual." } },
          { k: 'hrv', to: 'vigilar', t: { ca: 'El valor més baix de les últimes sis setmanes.', es: 'El valor más bajo de las últimas seis semanas.', fr: 'La valeur la plus basse des six dernières semaines.', en: 'The lowest value in the last six weeks.' } },
          { k: 'estat', to: 'vigilar', t: { ca: "No et trobes bé, i així li has dit a l'entrenador.", es: 'No te encuentras bien, y así se lo has dicho al entrenador.', fr: "Tu ne te sens pas bien, et tu l'as dit à ton entraîneur.", en: "You don't feel well, and you told your coach so." } }],
        accions: [{ ca: 'Avui, descans o una sessió molt suau.', es: 'Hoy, descanso o una sesión muy suave.', fr: "Aujourd'hui, repos ou une séance très légère.", en: 'Today, rest or a very easy session.' },
          { ca: "Parla-ho amb l'entrenador abans d'entrenar.", es: 'Háblalo con el entrenador antes de entrenar.', fr: "Parles-en à ton entraîneur avant de t'entraîner.", en: 'Talk to your coach before training.' }] },
      comp: {
        titular: { ca: 'Et sents a punt, però el cos va més just', es: 'Te sientes a punto, pero el cuerpo va más justo', fr: 'Tu te sens prêt, mais ton corps est à la limite', en: 'You feel ready, but your body is running tighter' },
        texto: { ca: "Et sents [[amb moltes ganes|+]], i això abans de competir és bon senyal. Però el teu cos va una mica més just del que sembla: portes [[quatre nits dormint menys|~]] del normal i el pols en repòs fa tres dies que està una mica alt. No és per preocupar-se, però sí per no passar-te avui. Explica al teu entrenador que aquests dies dorms poc.", es: "Te sientes [[con muchas ganas|+]], y eso antes de competir es buena señal. Pero tu cuerpo va algo más justo de lo que parece: llevas [[cuatro noches durmiendo menos|~]] de lo normal y el pulso en reposo lleva tres días un poco alto. No es para preocuparse, pero sí para no pasarte hoy. Cuéntale a tu entrenador que estos días duermes poco.", fr: "Tu as [[très envie d'y aller|+]], et avant une compétition c'est bon signe. Mais ton corps est un peu plus juste qu'il n'y paraît : tu enchaînes [[quatre nuits plus courtes|~]] que d'habitude et ton pouls au repos est un peu haut depuis trois jours. Rien d'inquiétant, mais évite d'en faire trop aujourd'hui. Dis à ton entraîneur que tu dors peu ces jours-ci.", en: "You're feeling [[really up for it|+]], and that's a good sign before competing. But your body is a bit more stretched than it looks: you've had [[four nights of less sleep|~]] than usual and your resting pulse has been a little high for three days. Nothing to worry about, but don't overdo it today. Let your coach know you've been sleeping little lately." },
        estrategies: [{ a: 'carga', t: { ca: "Redueix el volum d'avui un 20–30 % i mantén la qualitat", es: "Reduce el volumen de hoy un 20–30 % y mantén la calidad", fr: "Réduis le volume du jour de 20 à 30 % et garde la qualité", en: "Cut today's volume by 20–30% and keep the quality" }, w: { ca: "El cos va més just del que sents: quatre nits curtes i el pols una mica alt.", es: "El cuerpo va más justo de lo que sientes: cuatro noches cortas y el pulso algo alto.", fr: "Ton corps est plus juste que ce que tu ressens : quatre nuits courtes et un pouls un peu haut.", en: "Your body is more stretched than you feel: four short nights and a slightly high pulse." } }, { a: 'son', t: { ca: "Avança l'hora de dormir i apunta a 8 hores", es: "Adelanta la hora de dormir y apunta a 8 horas", fr: "Avance ton coucher et vise 8 heures", en: "Go to bed earlier and aim for 8 hours" }, w: { ca: "Encadenes quatre nits per sota de la teva mitjana.", es: "Encadenas cuatro noches por debajo de tu media.", fr: "Tu enchaînes quatre nuits sous ta moyenne.", en: "You've had four nights in a row below your average." } }, { a: 'nutr', t: { ca: "Sopa amb hidrats de carboni i una mica de proteïna", es: "Cena con hidratos de carbono y algo de proteína", fr: "Dîne avec des glucides et un peu de protéines", en: "Have dinner with carbohydrates and some protein" }, w: { ca: "Repon energia i afavoreix la recuperació abans de competir.", es: "Repone energía y favorece la recuperación antes de competir.", fr: "Recharge l'énergie et favorise la récupération avant de concourir.", en: "Refuels energy and supports recovery before competing." } }],
        resum: { ca: 'Tu et trobes molt bé, però el son i la FC en repòs porten uns dies fora del teu normal.', es: 'Tú te encuentras muy bien, pero el sueño y la FC en reposo llevan unos días fuera de tu normal.', fr: 'Tu te sens très bien, mais ton sommeil et ta FC au repos sont hors de ta normale depuis quelques jours.', en: 'You feel very good, but your sleep and resting HR have been outside your usual for a few days.' },
        troballes: [
          { k: 'son', to: 'vigilar', t: { ca: 'Quarta nit seguida dormint menys del teu normal.', es: 'Cuarta noche seguida durmiendo menos de tu normal.', fr: 'Quatrième nuit de suite à dormir moins que ta normale.', en: 'Fourth night in a row sleeping less than usual.' } },
          { k: 'rhr', to: 'vigilar', t: { ca: 'Per sobre de la teva franja per tercer dia seguit.', es: 'Por encima de tu franja por tercer día seguido.', fr: 'Au-dessus de ta plage pour le troisième jour de suite.', en: 'Above your range for the third day in a row.' } },
          { k: 'estat', to: 'be', t: { ca: 'Et trobes molt bé i amb ganes.', es: 'Te encuentras muy bien y con ganas.', fr: 'Tu te sens très bien et motivé.', en: 'You feel very good and keen.' } },
          { k: 'coach', to: 'vigilar', d: [38, 39, 40, 41], t: { ca: 'Li dius que estàs bé, però des de dilluns les dades marquen Moderat.', es: 'Le dices que estás bien, pero desde el lunes los datos marcan Moderado.', fr: 'Tu lui dis que tu vas bien, mais depuis lundi les données indiquent Modéré.', en: "You tell your coach you're fine, but since Monday the data have said Moderate." } }],
        accions: [{ ca: 'Entrena, però baixa una mica la intensitat.', es: 'Entrena, pero baja un poco la intensidad.', fr: "Entraîne-toi, mais baisse un peu l'intensité.", en: 'Train, but lower the intensity a little.' },
          { ca: "Explica-li a l'entrenador que aquests dies dorms poc.", es: 'Explícale al entrenador que estos días duermes poco.', fr: 'Explique à ton entraîneur que tu dors peu ces jours-ci.', en: "Tell your coach you haven't been sleeping much lately." }] },
      buit: {
        titular: { ca: "Encara no has fet el registre d'avui", es: 'Aún no has hecho el registro de hoy', fr: "Tu n'as pas encore fait le relevé du jour", en: "You haven't logged today yet" },
        texto: { ca: "Encara no has fet el registre d'avui, així que encara no sabem com arribes. Ahir tot estava [[al teu nivell habitual|+]] i va ser un bon dia, així que mentrestant pots prendre'l com a referència. Quan registris el pols, la HRV, el son i com et trobes, aquest resum s'actualitzarà.", es: "Todavía no has hecho el registro de hoy, así que aún no sabemos cómo llegas. Ayer todo estaba [[en tu nivel habitual|+]] y fue un buen día, así que mientras tanto puedes tomarlo como referencia. En cuanto registres el pulso, la HRV, el sueño y cómo te encuentras, este resumen se pondrá al día.", fr: "Tu n'as pas encore fait le relevé du jour, donc on ne sait pas encore dans quel état tu arrives. Hier, tout était [[à ton niveau habituel|+]] et c'était une bonne journée : tu peux t'en servir comme repère en attendant. Dès que tu enregistres ton pouls, ta HRV, ton sommeil et ton ressenti, ce résumé se mettra à jour.", en: "You haven't logged today yet, so we don't know how you're arriving yet. Yesterday everything was [[at your usual level|+]] and it was a good day, so you can use it as a guide for now. As soon as you log your pulse, HRV, sleep and how you feel, this summary will update." },
        estrategies: [{ a: 'reg', t: { ca: "Fes el registre abans d'entrenar", es: "Haz el registro antes de entrenar", fr: "Fais ton relevé avant de t'entraîner", en: "Log your data before training" }, w: { ca: "Sense les dades d'avui no podem adaptar les estratègies.", es: "Sin los datos de hoy no podemos adaptar las estrategias.", fr: "Sans les données du jour, on ne peut pas adapter les stratégies.", en: "Without today's data we can't tailor the strategies." } }, { a: 'carga', t: { ca: "Mentrestant, segueix el pla previst", es: "Mientras tanto, sigue el plan previsto", fr: "En attendant, suis le plan prévu", en: "In the meantime, follow the planned session" }, w: { ca: "Ahir tot estava dins el teu normal.", es: "Ayer todo estaba dentro de tu normal.", fr: "Hier, tout était dans ta normale.", en: "Yesterday everything was within your usual range." } }],
        resum: { ca: "Quan el facis, l'informe s'actualitzarà. Mentrestant, et pots guiar per ahir.", es: 'Cuando lo hagas, el informe se actualizará. Mientras tanto, puedes guiarte por ayer.', fr: "Quand tu l'auras fait, le rapport se mettra à jour. En attendant, tu peux te fier à hier.", en: 'Once you do, the report will update. Meanwhile, you can go by yesterday.' },
        troballes: [
          { k: 'reg', to: 'info', t: { ca: "Falten la FC, l'HRV, el son i com estàs.", es: 'Faltan la FC, la HRV, el sueño y cómo estás.', fr: 'Il manque la FC, la HRV, le sommeil et comment tu vas.', en: 'Missing: HR, HRV, sleep and how you feel.' } },
          { k: 'ahir', to: 'be', d: [40], t: { ca: 'Totes les dades eren dins la teva franja.', es: 'Todos los datos estaban dentro de tu franja.', fr: 'Toutes les données étaient dans ta plage.', en: 'All your data were within your range.' } }],
        accions: [{ ca: "Fes el registre abans d'entrenar.", es: 'Haz el registro antes de entrenar.', fr: "Fais ton relevé avant de t'entraîner.", en: 'Log your data before training.' },
          { ca: "Si et trobes bé, segueix el pla de l'entrenador.", es: 'Si te encuentras bien, sigue el plan del entrenador.', fr: 'Si tu te sens bien, suis le plan de ton entraîneur.', en: "If you feel good, follow your coach's plan." }] },
      nou: {
        titular: { ca: 'Benvinguda. Encara estem aprenent com ets', es: 'Bienvenida. Aún estamos aprendiendo cómo eres', fr: 'Bienvenue. On apprend encore à te connaître', en: "Welcome. We're still getting to know you" },
        texto: { ca: "Estem començant a conèixer-te. Portes [[5 dies]] registrant; quan arribis a [[14]], podrem dir-te què és normal per a tu i comparar cada dia amb això. De moment hi ha una bona notícia: dorms [[força hores|+]], un molt bon punt de partida. Continua registrant cada matí; com més constant siguis, més et servirà.", es: "Estamos empezando a conocerte. Llevas [[5 días]] registrando; cuando llegues a [[14]], podremos decirte qué es lo normal para ti y comparar cada día con eso. De momento hay una buena noticia: duermes [[bastantes horas|+]], un muy buen punto de partida. Sigue registrando cada mañana; cuanto más constante seas, más te servirá.", fr: "On commence à te connaître. Tu enregistres tes données depuis [[5 jours]] ; à [[14]], on pourra te dire ce qui est normal pour toi et comparer chaque jour à ça. Pour l'instant, une bonne nouvelle : tu dors [[suffisamment|+]], un très bon point de départ. Continue à faire ton relevé chaque matin ; plus tu le feras régulièrement, plus ça te sera utile.", en: "We're just getting to know you. You've been logging for [[5 days]]; once you reach [[14]], we'll be able to tell you what's normal for you and compare each day with it. For now there's good news: you're sleeping [[plenty|+]], a great starting point. Keep logging every morning; the more consistent you are, the more useful this becomes." },
        estrategies: [{ a: 'reg', t: { ca: "Fes el registre cada matí en despertar, abans d'aixecar-te", es: "Haz el registro cada mañana al despertar, antes de levantarte", fr: "Fais ton relevé chaque matin au réveil, avant de te lever", en: "Log every morning when you wake up, before getting up" }, w: { ca: "Mesurar sempre en el mateix moment fa que les dades siguin comparables.", es: "Medir siempre en el mismo momento hace que los datos sean comparables.", fr: "Mesurer toujours au même moment rend les données comparables.", en: "Measuring at the same time every day makes the data comparable." } }, { a: 'son', t: { ca: "Mantén un horari de son regular", es: "Mantén un horario de sueño regular", fr: "Garde des horaires de sommeil réguliers", en: "Keep a regular sleep schedule" }, w: { ca: "Anar a dormir i llevar-te a la mateixa hora fa que el teu normal sigui més fiable.", es: "Acostarte y levantarte a la misma hora hace que tu normal sea más fiable.", fr: "Te coucher et te lever à la même heure rend ta normale plus fiable.", en: "Going to bed and getting up at the same time makes your usual range more reliable." } }, { a: 'carga', t: { ca: "Segueix el pla del teu entrenador", es: "Sigue el plan de tu entrenador", fr: "Suis le plan de ton entraîneur", en: "Follow your coach's plan" }, w: { ca: "Encara estem aprenent quin és el teu normal.", es: "Aún estamos aprendiendo cuál es tu normal.", fr: "On apprend encore quelle est ta normale.", en: "We're still learning what your usual range is." } }],
        resum: { ca: 'Amb 14 dies de dades podrem comparar cada dia amb el teu normal.', es: 'Con 14 días de datos podremos comparar cada día con tu normal.', fr: 'Avec 14 jours de données, on pourra comparer chaque jour à ta normale.', en: 'With 14 days of data we can compare each day with your usual.' },
        troballes: [
          { k: 'band', to: 'info', t: { ca: 'Quan arribis a 14 dies, calcularem la teva franja personal.', es: 'Cuando llegues a 14 días, calcularemos tu franja personal.', fr: 'Quand tu atteindras 14 jours, on calculera ta plage personnelle.', en: "When you reach 14 days, we'll calculate your personal range." } },
          { k: 'son', to: 'be', d: [37, 38, 39, 40, 41], t: { ca: 'Dorms força hores: un bon punt de partida.', es: 'Duermes bastantes horas: un buen punto de partida.', fr: "Tu dors pas mal d'heures : un bon point de départ.", en: 'You sleep a good number of hours: a solid starting point.' } }],
        accions: [{ ca: 'Continua fent el registre cada matí.', es: 'Sigue haciendo el registro cada mañana.', fr: 'Continue à faire ton relevé chaque matin.', en: 'Keep logging every morning.' },
          { ca: "Segueix el pla de l'entrenador.", es: 'Sigue el plan del entrenador.', fr: 'Suis le plan de ton entraîneur.', en: "Follow your coach's plan." }] },
    },
    FB_WEEK: {
      38: {
        titular: { ca: 'Setmana de recuperació completa', es: 'Semana de recuperación completa', fr: 'Semaine de récupération complète', en: 'A week of full recovery' },
        resum: { ca: 'Després del refredat, el formulari i les dades tornen a estar on toca.', es: 'Después del resfriado, el formulario y los datos vuelven a estar donde toca.', fr: 'Après le rhume, le formulaire et les données sont revenus à la normale.', en: 'After the cold, your form and data are back where they should be.' },
        troballes: [
          { k: 'salut', to: 'be', t: { ca: 'El refredat de la setmana passada ha quedat enrere.', es: 'El resfriado de la semana pasada ha quedado atrás.', fr: 'Le rhume de la semaine dernière est derrière toi.', en: "Last week's cold is behind you." } },

    // Instruccions per a la IA, en l'idioma en què ha de respondre. Les claus del JSON (titular, resum, troballes…) són sempre les mateixes.
    AI: {
      system: {
        ca: `Ets el mòdul d'anàlisi de Max Tracking, una aplicació que retorna a esportistes de competició joves (de 14 a 20 anys) les seves pròpies dades de salut i recuperació.
Normes:
- Escriu en català, en segona persona (tu), amb un to proper, clar i seriós. Frases curtes, sense tecnicismes, sense exclamacions.
- Compara la persona NOMÉS amb ella mateixa (la seva franja habitual o els seus registres anteriors). Mai amb altres esportistes.
- Suggereixes, no manes. No facis diagnòstics mèdics ni parlis de malalties.
- Si les dades indiquen clarament que cal descansar, o la persona diu que no es troba bé, digues-ho amb calma i anima-la a parlar-ne amb l'entrenador.
- Cada xifra de les dades va entre dobles claudàtors, per exemple [[7 h 20]]. Afegeix |! si està clarament fora de la franja en la direcció dolenta, |~ si està una mica fora o al límit, i |+ si és millor que l'habitual. Dins la franja, sense marca.
- No facis servir emojis, markdown ni cometes.
- Respon NOMÉS amb un objecte JSON vàlid, sense cap text abans ni després.`,
        es: `Eres el módulo de análisis de Max Tracking, una aplicación que devuelve a deportistas de competición jóvenes (de 14 a 20 años) sus propios datos de salud y recuperación.
Normas:
- Escribe en castellano, en segunda persona (tú), con un tono cercano, claro y serio. Frases cortas, sin tecnicismos, sin exclamaciones.
- Compara a la persona SOLO consigo misma (su franja habitual o sus registros anteriores). Nunca con otros deportistas.
- Sugieres, no mandas. No hagas diagnósticos médicos ni hables de enfermedades.
- Si los datos indican claramente que hay que descansar, o la persona dice que no se encuentra bien, dilo con calma y anímala a hablarlo con el entrenador.
- Cada cifra de los datos va entre dobles corchetes, por ejemplo [[7 h 20]]. Añade |! si está claramente fuera de la franja en la dirección mala, |~ si está un poco fuera o al límite, y |+ si es mejor de lo habitual. Dentro de la franja, sin marca.
- No uses emojis, markdown ni comillas.
- Responde SOLO con un objeto JSON válido, sin ningún texto antes ni después.`,
        fr: `Tu es le module d'analyse de Max Tracking, une application qui restitue à de jeunes sportifs de compétition (de 14 à 20 ans) leurs propres données de santé et de récupération.
Règles :
- Écris en français, à la deuxième personne (tu), sur un ton proche, clair et sérieux. Phrases courtes, sans jargon, sans exclamations.
- Compare la personne UNIQUEMENT avec elle-même (sa plage habituelle ou ses relevés précédents). Jamais avec d'autres sportifs.
- Tu suggères, tu n'ordonnes pas. Ne pose aucun diagnostic médical et ne parle pas de maladies.
- Si les données indiquent clairement qu'il faut se reposer, ou si la personne dit qu'elle ne se sent pas bien, dis-le calmement et encourage-la à en parler à son entraîneur.
- Chaque chiffre des données va entre doubles crochets, par exemple [[7 h 20]]. Ajoute |! s'il est nettement hors de la plage dans le mauvais sens, |~ s'il est un peu hors de la plage ou à la limite, et |+ s'il est meilleur que d'habitude. Dans la plage, sans marque.
- N'utilise ni emojis, ni markdown, ni guillemets.
- Réponds UNIQUEMENT avec un objet JSON valide, sans aucun texte avant ni après.`,
        en: `You are the analysis module of Max Tracking, an app that gives young competitive athletes (aged 14 to 20) their own health and recovery data back.
Rules:
- Write in English, in the second person (you), in a warm, clear and serious tone. Short sentences, no jargon, no exclamation marks.
- Compare the person ONLY with themselves (their usual range or their previous entries). Never with other athletes.
- You suggest, you do not order. Do not make medical diagnoses or talk about illnesses.
- If the data clearly show they need to rest, or the person says they do not feel well, say so calmly and encourage them to talk to their coach.
- Every figure from the data goes inside double square brackets, for example [[7h 20m]]. Add |! if it is clearly outside the range in the bad direction, |~ if it is slightly outside or borderline, and |+ if it is better than usual. Within the range, no mark.
- Do not use emojis, markdown or quotation marks.
- Reply ONLY with a valid JSON object, with no text before or after.`,
      },
      json: {
        ca: (keys, when) => `Respon amb aquest JSON: {"titular": "màxim 8 paraules, sense xifres", "resum": "1 frase curta, màxim 20 paraules", "troballes": [{"dada": "una de: ${keys}", "to": "be | vigilar | info", "text": "frase curta, màxim 14 paraules; no repeteixis la xifra, l'app ja la mostra al costat"}], "accions": ["1 o 2 accions curtes i concretes ${when}"]}. Dona de 2 a 4 troballes, de la més important a la menys, i inclou també el que va bé.`,
        es: (keys, when) => `Responde con este JSON, con las claves tal cual: {"titular": "máximo 8 palabras, sin cifras", "resum": "1 frase corta, máximo 20 palabras", "troballes": [{"dada": "una de: ${keys}", "to": "be | vigilar | info", "text": "frase corta, máximo 14 palabras; no repitas la cifra, la app ya la muestra al lado"}], "accions": ["1 o 2 acciones cortas y concretas ${when}"]}. En "to": be = va bien, vigilar = a vigilar, info = neutro. Da de 2 a 4 hallazgos, del más importante al menos, e incluye también lo que va bien.`,
        fr: (keys, when) => `Réponds avec ce JSON, en gardant les clés telles quelles : {"titular": "8 mots maximum, sans chiffres", "resum": "1 phrase courte, 20 mots maximum", "troballes": [{"dada": "une de : ${keys}", "to": "be | vigilar | info", "text": "phrase courte, 14 mots maximum ; ne répète pas le chiffre, l'app l'affiche déjà à côté"}], "accions": ["1 ou 2 actions courtes et concrètes ${when}"]}. Pour "to" : be = ça va bien, vigilar = à surveiller, info = neutre. Donne de 2 à 4 constats, du plus important au moins important, et inclus aussi ce qui va bien.`,
        en: (keys, when) => `Reply with this JSON, keeping the keys exactly as they are: {"titular": "8 words max, no figures", "resum": "1 short sentence, 20 words max", "troballes": [{"dada": "one of: ${keys}", "to": "be | vigilar | info", "text": "short sentence, 14 words max; do not repeat the figure, the app already shows it alongside"}], "accions": ["1 or 2 short, concrete actions ${when}"]}. For "to": be = going well, vigilar = needs attention, info = neutral. Give 2 to 4 findings, from most to least important, and also include what is going well.`,
      },
      qCtxHead: {
        ca: "Context dels seus qüestionaris (esmenta-ho només si és rellevant avui i tenint-ho en compte en les estratègies; si no aporta res, no en parlis):",

        ca: 'Afegeix també "texto": un paràgraf de 3 a 5 frases que expliqui com està avui la persona en llenguatge senzill, com ho faria un bon entrenador: sense tecnicismes (si parles de la HRV, explica-la amb paraules planeres), sense repetir totes les xifres, i marca entre dobles claudàtors les 2 o 3 idees clau.',
        es: 'Añade también "texto": un párrafo de 3 a 5 frases que explique cómo está hoy la persona en lenguaje sencillo, como lo haría un buen entrenador: sin tecnicismos (si hablas de la HRV, explícala con palabras llanas), sin repetir todas las cifras, y marca entre dobles corchetes las 2 o 3 ideas clave.',
        fr: 'Ajoute aussi "texto" : un paragraphe de 3 à 5 phrases qui explique comment va la personne aujourd\'hui, dans un langage simple, comme le ferait un bon entraîneur : sans jargon (si tu parles de la HRV, explique-la avec des mots simples), sans répéter tous les chiffres, et mets entre doubles crochets les 2 ou 3 idées clés.',
        en: 'Also add "texto": a paragraph of 3 to 5 sentences explaining how the person is today in plain language, the way a good coach would: no jargon (if you mention HRV, explain it in simple words), without repeating every figure, and put the 2 or 3 key ideas inside double square brackets.',
      },
      stratAsk: {
        ca: 'I "estrategies": 2 o 3 estratègies de recuperació professionals, concretes i adequades a la seva edat per a avui, cadascuna {"area": "son | carga | hidr | nutr | mob | resp | com | reg", "accio": "acció concreta amb dosi o moment, màxim 12 paraules", "motiu": "per què, basat en les seves dades, màxim 18 paraules"}. Sense suplements ni medicaments.',
        es: 'Y "estrategies": 2 o 3 estrategias de recuperación profesionales, concretas y adecuadas a su edad para hoy, cada una {"area": "son | carga | hidr | nutr | mob | resp | com | reg", "accio": "acción concreta con dosis o momento, máximo 12 palabras", "motiu": "por qué, basado en sus datos, máximo 18 palabras"}. Sin suplementos ni medicamentos.',
        fr: 'Et "estrategies" : 2 ou 3 stratégies de récupération professionnelles, concrètes et adaptées à son âge pour aujourd\'hui, chacune {"area": "son | carga | hidr | nutr | mob | resp | com | reg", "accio": "action concrète avec dose ou moment, 12 mots maximum", "motiu": "pourquoi, selon ses données, 18 mots maximum"}. Sans compléments ni médicaments.',
        en: 'And "estrategies": 2 or 3 professional, concrete, age-appropriate recovery strategies for today, each {"area": "son | carga | hidr | nutr | mob | resp | com | reg", "accio": "concrete action with dose or timing, 12 words max", "motiu": "why, based on their data, 18 words max"}. No supplements or medication.',
      },

        fr: v => `La personne a 5 jours de données ; la plage personnelle se calcule sur 14 jours, elle n'en a donc pas encore. Données du jour : FC au repos ${v.rhr}, HRV ${v.hrv}, sommeil ${v.son}, comment elle va ${v.estat}.\nNe compare avec aucune plage. Souhaite-lui la bienvenue et explique que l'app apprend encore à la connaître.`,
        en: v => `They have 5 days of data; the personal range is calculated from 14 days, so they do not have one yet. Today's data: resting HR ${v.rhr}, HRV ${v.hrv}, sleep ${v.son}, how they feel ${v.estat}.\nDo not compare with any range. Welcome them and explain that the app is still getting to know them.`,
