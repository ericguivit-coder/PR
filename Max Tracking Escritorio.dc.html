      h('div', { key: 'logo', title: 'Max Tracking', style: { width: 34, height: 34, flex: 'none', marginBottom: 18, borderRadius: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.ink, color: C.bg, fontSize: 12, fontWeight: 700, letterSpacing: '.02em' } }, 'MT'),
      this.PAGES.map(item), h('div', { key: 'sp', style: { flex: 1 } }), this.PAGES2.map(item),
      h('div', { key: 'av', title: `${w.name} · ${w.code}`, style: { marginTop: 10, width: 34, height: 34, flex: 'none', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', boxSizing: 'border-box', background: C.s3, border: `1px solid ${C.line2}`, fontSize: 13, fontWeight: 600, color: C.ink2 } }, w.name[0]));
  }
  pageEl(sc, D, g) {
    const s = this.state, P = { avui: this.pageAvui, setmana: this.pageSetmana, mes: this.pageMes, evolucio: this.pageEvol, priv: this.pagePriv, ajustos: this.pageAjustos }[s.page] || this.pageAvui;
    return h('div', { key: `pg-${s.page}-${sc}-${s.visit}`, style: { boxSizing: 'border-box', width: '100%', maxWidth: g.cw + g.pad * 2, margin: '0 auto', padding: `0 ${g.pad}px 80px` } }, P.call(this, sc, D, g));
  }
  pickScn(k) { this.setState(st => ({ scenario: k, hoverF: null, pinF: null, week: 0, month: 0, visit: st.visit + 1, range: k === 'nou' ? 7 : st.range, evoRange: k === 'nou' ? 7 : st.evoRange === 7 ? 28 : st.evoRange })); }
  setProtoHidden(v) { try { localStorage.setItem('mt-proto-hidden', v ? '1' : '0'); } catch (e) {} this.setState({ pHidden: v, pOpen: false }); }
  // Control temporal del prototip: botó flotant per canviar d'escenari (tecla E per amagar-lo o recuperar-lo).
  protoEl(sc) {
    const s = this.state, C = this.C;
    if (s.pHidden) return h('div', { key: 'proto-h', className: 'mt-hc', title: 'Mostrar escenario (tecla E)', onClick: () => this.setProtoHidden(false),
      style: { position: 'fixed', right: 0, bottom: 0, width: 36, height: 36, zIndex: 60, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
      h('span', { className: 'mt-dot', style: { width: 6, height: 6, borderRadius: '50%', background: C.ink } }));
    const dotOf = k => { const p = k === 'nou' ? null : this.data(k).pos[41]; return p == null ? 'rgba(236,237,239,.3)' : this.tone(this.dayH(p)); };
    const rows = this.SCN.map(x => { const on = x.k === sc;
      return h('button', { key: x.k, className: 'mt-pr', onClick: () => this.pickScn(x.k),
        style: { display: 'flex', alignItems: 'center', gap: 10, width: '100%', padding: '8px 10px', border: 'none', borderRadius: 7, cursor: 'pointer', textAlign: 'left', fontSize: 13, background: on ? 'rgba(255,255,255,.08)' : 'transparent', color: on ? C.ink : C.ink2 } },
        h('span', { style: { width: 7, height: 7, flex: 'none', borderRadius: '50%', background: dotOf(x.k) } }), h('span', { style: { flex: 1 } }, x.t), on ? h('span', { style: { color: C.ink } }, this.icon('check', 13)) : null); });
    const foot = { display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%', boxSizing: 'border-box', padding: '8px 10px', border: 'none', borderRadius: 7, background: 'transparent', cursor: 'pointer', fontSize: 12.5, color: C.ink2, textDecoration: 'none' };
    const panel = s.pOpen ? h('div', { key: 'pp', style: { position: 'absolute', right: 0, bottom: 50, width: 236, padding: 6, boxSizing: 'border-box', borderRadius: 12, background: 'rgba(22,23,26,.96)', backdropFilter: 'blur(14px)', WebkitBackdropFilter: 'blur(14px)', border: `1px solid ${C.line2}`, boxShadow: '0 18px 50px rgba(0,0,0,.5)', animation: 'mtIn .2s cubic-bezier(.2,.7,.2,1) both' } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', padding: '6px 10px 8px', fontSize: 12, color: C.ink3 } }, h('span', null, 'Escenario'), h('span', null, 'Prototipo')),
      rows,
      h('div', { style: { height: 1, margin: '6px 4px', background: C.line } }),
      h('a', { className: 'mt-pr', href: './Max%20Tracking%20-%20M%C3%B3vil.dc.html', target: '_blank', rel: 'noopener', style: foot }, h('span', null, 'Abrir versión móvil'), h('span', null, '↗')),
      h('button', { className: 'mt-pr', onClick: () => this.setProtoHidden(true), style: foot }, h('span', null, 'Ocultar botón'), h('span', { style: { fontFamily: this.MONO, fontSize: 10, padding: '2px 5px', border: `1px solid ${C.line2}`, borderRadius: 4, color: C.ink3 } }, 'E'))) : null;
    const btn = h('button', { key: 'pb', className: 'mt-pb', 'data-open': s.pOpen ? '' : undefined, title: 'Escenario del prototipo · E para ocultar', onClick: () => this.setState({ pOpen: !s.pOpen }),
      style: { width: 40, height: 40, borderRadius: '50%', border: `1px solid ${C.line2}`, background: 'rgba(22,23,26,.9)', backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)', color: C.ink, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 8px 24px rgba(0,0,0,.35)', padding: 0 } },
      this.icon('flask', 17));
    return [s.pOpen ? h('div', { key: 'pbd', onClick: () => this.setState({ pOpen: false }), style: { position: 'fixed', inset: 0, zIndex: 59 } }) : null,
      h('div', { key: 'proto', style: { position: 'fixed', right: 20, bottom: 20, zIndex: 60 } }, panel, btn)];
  }

  renderVals() {
    const s = this.state, sc = s.scenario, D = this.data(sc), g = this.geom(), C = this.C;
    return {
      rootSt: { display: 'flex', height: '100vh', overflow: 'hidden', background: C.bg, color: C.ink, fontFamily: this.SANS },
      rail: this.railEl(sc), mainRef: this.mainRef, mainSt: { flex: 1, minWidth: 0, height: '100vh', overflowY: 'auto' },
      page: this.pageEl(sc, D, g), proto: this.protoEl(sc),
    };
  }
}
</script>
