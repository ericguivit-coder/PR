<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Tracking · Preparador (nuevo)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>html,body{margin:0;background:#F7F8FA;overflow:hidden}</style>
</helmet>
<dc-import name="Max Tracking Panel nuevo" coach-name="{{ coachName }}" ai-live="{{ aiLive }}"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;coachName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Preparador&quot;},&quot;aiLive&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;IA&quot;}}">
// Pàgina del panell del preparador, VERSIÓ NOVA en construcció (des del 06-10-2026): tota la lògica és a «Max Tracking Panel nuevo.dc.html».
// coachName: el nom del preparador al menú d'usuari (sense nom, hi surt «Preparador físic»). aiLive: si l'assistent fa servir la IA (només dins el host).
// Quan l'usuari l'aprovi, el motor nou substituirà «Max Tracking Panel.dc.html» i aquesta pàgina s'esborrarà.
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
