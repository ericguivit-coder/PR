<style>
/* Els efectes «:hover» van dins @media(hover:hover): en un iPad tàctil es quedarien enganxats després del toc. */
html,body{margin:0}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input{font:inherit;color:inherit}
@keyframes mtIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mtSlideL{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.mt-in{animation:mtIn .35s cubic-bezier(.2,.7,.2,1) both}
.mt-rsz>span{opacity:0;transition:opacity .15s}.mt-rsz:focus-visible>span,.mt-rsz[data-drag]>span{opacity:1}@media(hover:hover){.mt-rsz:hover>span{opacity:1}}
.mt-nav{transition:background .12s,color .12s}@media(hover:hover){.mt-nav:not([data-on]):not([aria-disabled]):hover{background:var(--mt-hov)!important}}
.mt-hov{transition:background .12s}@media(hover:hover){.mt-hov:hover{background:var(--mt-hov)!important}}
.mt-pri{transition:filter .12s}@media(hover:hover){.mt-pri:hover{filter:brightness(1.08)}}
.mt-lab{transition:background .12s}@media(hover:hover){.mt-lab:hover{background:var(--mt-labh)!important}}
.mt-gm{transition:box-shadow .12s}@media(hover:hover){.mt-gm:hover{box-shadow:var(--mt-gmsh);z-index:1}}
/* Animacions d'Inici (des del 15-10-2026), suaus: en prémer, els botons s'enfonsen una mica (mt-tap; les targetes i les files, menys: mt-tapc);
   la fletxa › dels enllaços i de les targetes s'avança en passar el ratolí (mt-chev / mt-chi). Un avís revisat amb ✓: la casella s'omple i el
   ✓ es dibuixa (mt-draw), la fila marxa cap a l'esquerra i es tanca (mt-leave; --h = la seva alçada) i, si es desfà, torna (mt-back). L'avís
   de baix amb «Desfés» entra i surt lliscant (mtToastIn / mtToastOut) i una línia fina marca el temps que queda (mtShrink). Les barres
   de l'estat de l'equip creixen des de la línia (mt-gu cap amunt, mt-gd cap avall) i els números apareixen (mt-fade). */
.mt-tap{transition:transform .14s cubic-bezier(.2,.7,.2,1),filter .12s,background .12s}.mt-tap:active{transform:scale(.95)}
.mt-tapc{transition:transform .16s cubic-bezier(.2,.7,.2,1),background .12s}.mt-tapc:active{transform:scale(.985)}
.mt-chev .mt-chi{display:inline-flex;transition:transform .18s cubic-bezier(.2,.7,.2,1)}@media(hover:hover){.mt-chev:hover .mt-chi{transform:translateX(3px)}}
@keyframes mtRowOut{0%,32%{opacity:1;transform:none;max-height:var(--h,160px)}64%{opacity:0;transform:translateX(-18px);max-height:var(--h,160px)}100%{opacity:0;transform:translateX(-18px);max-height:0;padding-top:0;padding-bottom:0;margin-top:0;margin-bottom:0;border-top-width:0}}
@keyframes mtRowIn{0%{opacity:0;transform:translateX(-18px);max-height:0}45%{opacity:0;transform:translateX(-18px);max-height:var(--h,160px)}100%{opacity:1;transform:none;max-height:var(--h,160px)}}
.mt-leave{animation:mtRowOut .66s cubic-bezier(.4,0,.2,1) forwards;overflow:hidden;pointer-events:none}
.mt-back{animation:mtRowIn .5s cubic-bezier(.2,.7,.2,1) both;overflow:hidden}
@keyframes mtDraw{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
.mt-draw{stroke-dasharray:22;animation:mtDraw .26s cubic-bezier(.2,.7,.2,1) both}
@keyframes mtToastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes mtToastOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,12px)}}
@keyframes mtShrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes mtGrow{from{transform:scaleY(0)}to{transform:none}}
.mt-gu{transform-origin:50% 100%;animation:mtGrow .6s cubic-bezier(.2,.7,.2,1) both}.mt-gd{transform-origin:50% 0;animation:mtGrow .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes mtFade{from{opacity:0}to{opacity:1}}.mt-fade{animation:mtFade .45s ease both}
/* Des del 16-10-2026: les barres d'hores del mes creixen cap a la dreta (mt-gx); el full «Nova sessió» entra pujant una mica (mtSheet); el «+» de
   cada dia del mes surt en passar el ratolí (amb el dit no hi és: s'afegeix des de la setmana). */
@keyframes mtGrowX{from{transform:scaleX(0)}to{transform:none}}.mt-gx{transform-origin:0 50%;animation:mtGrowX .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes mtSheet{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.mt-mcell .mt-add{opacity:0;transition:opacity .15s}.mt-mcell .mt-add:focus-visible{opacity:1}@media(hover:hover){.mt-mcell:hover .mt-add{opacity:1}}@media(hover:none){.mt-mcell .mt-add{display:none}}
.mt-dcol{transition:background .15s}@media(hover:hover){.mt-dcol:hover{background:var(--mt-band)!important}}
.mt-lnk{text-decoration:none}@media(hover:hover){.mt-lnk:hover{text-decoration:underline;text-underline-offset:2px}}
.mt-scroll::-webkit-scrollbar{width:12px}.mt-scroll::-webkit-scrollbar-thumb{background:var(--mt-sb);border-radius:12px;border:4px solid var(--mt-bg)}.mt-scroll::-webkit-scrollbar-track{background:transparent}
.mt-num{font-variant-numeric:tabular-nums}
input::placeholder{color:var(--mt-ph)}
:focus-visible{outline:2px solid var(--mt-acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
</style>

    const panel = h('div', { key: 'cp', role: big ? 'complementary' : 'dialog', 'aria-label': this.t('chatTitle'), style: { ...box, boxSizing: 'border-box', display: 'flex', flexDirection: 'column', background: K.bg || C.s1 } },

  }

  // ── Prototip (temporal; només en castellà) ───────────────────────────
  // Botó flotant (tecla E per amagar-lo): obrir l'app del deportista i esborrar el que s'ha desat, per tornar a començar la demostració.
  setProtoHidden(v) { try { localStorage.setItem('mt-prep-proto-hidden', v ? '1' : '0'); } catch (e) {} this.setState({ pHidden: v, pOpen: false }); }
  resetDemo() { try { ['mt-prep-aj', 'mt-prep-rev', 'mt-prep-rules', 'mt-prep-tpl', 'mt-prep-plan'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
    this.setState({ dec: {}, rev: {}, sel: {}, note: {}, rules: {}, tpl: {}, tplEd: null, lateSeen: {}, pOpen: false, chatLog: [], plan: { add: {}, mod: {}, del: {} }, edit: null }); }
  protoEl() {

      // Hora simulada: la hora límit, les sessions que comencen i l'orientació que veu el deportista si no es decideix a temps.
      h('div', { style: { padding: '6px 10px 8px' } }, h('div', { style: { fontSize: 12, color: C.ink2, marginBottom: 6 } }, `Hora simulada: ${minHm(this.now())}`),
        h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 4 } }, ['8:30', '10:30', '15:05', '16:05'].map(t => { const on = minHm(this.now()) === t;
          return h('button', { key: t, type: 'button', className: 'mt-hov', onClick: () => this.setState({ clock: { base: hmMin(t), t0: Date.now() }, lateSeen: {} }),
            style: { height: 26, padding: '0 9px', borderRadius: 6, border: `1px solid ${on ? C.acc : C.line2}`, background: on ? C.accBg : C.s1, color: on ? C.accInk : C.ink, fontSize: 12, fontWeight: 600, cursor: 'pointer' } }, t); }))),

      h('button', { type: 'button', className: 'mt-hov', onClick: () => this.resetDemo(), style: it }, h('span', null, 'Borrar ajustes, avisos revisados, reglas, plantillas y cambios en las sesiones'), h('span', null, '')),
      h('button', { type: 'button', className: 'mt-hov', onClick: () => { this.resetExp(); this.setState({ pOpen: false }); }, style: it }, h('span', null, 'Reiniciar el experimento'), h('span', null, '')),
      h('button', { type: 'button', className: 'mt-hov', onClick: () => this.setProtoHidden(true), style: it }, h('span', null, 'Ocultar botón'), h('span', { style: { fontSize: 10, padding: '2px 5px', border: `1px solid ${C.line2}`, borderRadius: 4, color: C.ink2 } }, 'E'))) : null;
    const btn = h('button', { key: 'pb', type: 'button', title: 'Prototipo · E para ocultar', 'aria-expanded': !!s.pOpen, onClick: () => this.setState({ pOpen: !s.pOpen }),
      style: { width: 40, height: 40, borderRadius: '50%', border: `1px solid ${C.line2}`, background: C.s1, color: C.ink, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: `0 8px 24px ${C.pop}`, padding: 0 } }, this.icon('flask', 17));
    return [s.pOpen ? h('div', { key: 'pbd', onClick: () => this.setState({ pOpen: false }), style: { position: 'fixed', inset: 0, zIndex: 59 } }) : null,
      // Amb el xat gran, el botó del prototip va a l'esquerra del xat.
      h('div', { key: 'proto', style: { position: 'fixed', right: s.chatOpen && s.chatBig ? Math.min(this.chatDock().w + 20, s.vw - 60) : 36 + this.fabSize(), bottom: 24 + (this.fabSize() - 40) / 2, zIndex: 60 } }, panel, btn)];
  }

  renderVals() {
    this.derive();
    const C = this.C, lab = this.lab();
    return {

        transition: 'background .3s, color .3s', '--mt-hov': C.hov, '--mt-sb': this.ov(.14), '--mt-bg': C.bg, '--mt-acc': C.acc, '--mt-ph': C.ink3, '--mt-labh': C.hov2 || C.s2, '--mt-band': C.s2, '--mt-gmsh': C.gmSh || 'none' },
