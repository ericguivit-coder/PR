/* Els efectes «:hover» van dins @media(hover:hover): en un iPad tàctil es quedarien enganxats després del toc. */
html,body{margin:0}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input{font:inherit;color:inherit}
@keyframes mtIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mt-in{animation:mtIn .35s cubic-bezier(.2,.7,.2,1) both}
.mt-nav{transition:background .12s,color .12s}@media(hover:hover){.mt-nav:not([data-on]):not([aria-disabled]):hover{background:var(--mt-hov)!important}}
.mt-hov{transition:background .12s}@media(hover:hover){.mt-hov:hover{background:var(--mt-hov)!important}}
.mt-pri{transition:filter .12s}@media(hover:hover){.mt-pri:hover{filter:brightness(1.08)}}
.mt-lnk{text-decoration:none}@media(hover:hover){.mt-lnk:hover{text-decoration:underline;text-underline-offset:2px}}
.mt-scroll::-webkit-scrollbar{width:12px}.mt-scroll::-webkit-scrollbar-thumb{background:var(--mt-sb);border-radius:12px;border:4px solid var(--mt-bg)}.mt-scroll::-webkit-scrollbar-track{background:transparent}
.mt-num{font-variant-numeric:tabular-nums}
input::placeholder{color:var(--mt-ph)}
:focus-visible{outline:2px solid var(--mt-acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
</style>
</helmet>
<div style="{{ rootSt }}">{{ side }}<div style="{{ colSt }}">{{ top }}<main ref="{{ mainRef }}" class="mt-scroll" style="{{ mainSt }}">{{ page }}</main></div>{{ extra }}</div>

  // Resum del dia de la IA, per grup (al prototip, textos fixos fets amb les dades d'avui).
  AIS: {
    T: { h: { ca: 'La majoria, dins del seu normal; tres porten uns quants dies fora', es: 'La mayoría, en su normal; tres llevan varios días fuera', fr: 'La plupart dans leur normale ; trois en dehors depuis plusieurs jours', en: 'Most are within their usual; three have been outside it for several days' },
      p: { ca: "11 de 20 estan en Òptim. Martí i Pol porten tres dies en Recuperació, i Abril hi ha entrat avui. Biel porta dos dies amb la HRV per sota del seu normal. Laia continua amb participació reduïda per una lesió, i Arnau no té dades de la polsera des d'ahir.",
        es: '11 de 20 están en Óptimo. Martí y Pol llevan tres días en Recuperación, y Abril ha entrado hoy. Biel lleva dos días con la HRV por debajo de su normal. Laia sigue con participación reducida por una lesión, y Arnau no tiene datos de la pulsera desde ayer.',
        fr: "11 sur 20 sont en Optimal. Martí et Pol sont en Récupération depuis trois jours, et Abril y entre aujourd'hui. Biel a la HRV sous sa normale depuis deux jours. Laia a toujours une participation réduite à cause d'une blessure, et Arnau n'a plus de données du bracelet depuis hier.",
        en: "11 of 20 are Optimal. Martí and Pol have been in Recovery for three days, and Abril moved into it today. Biel's HRV has been below usual for two days. Laia still has reduced participation because of an injury, and Arnau has had no wearable data since yesterday." } },
    A: { h: { ca: 'Dos en Recuperació des de dimarts', es: 'Dos en Recuperación desde el martes', fr: 'Deux en Récupération depuis mardi', en: 'Two in Recovery since Tuesday' },
      p: { ca: "5 de 10 estan en Òptim. Martí i Pol porten tres dies en Recuperació; Pol, amb una malaltia des de diumenge. Biel porta dos dies amb la HRV per sota del seu normal, i Arnau no té dades de la polsera des d'ahir.",
        es: '5 de 10 están en Óptimo. Martí y Pol llevan tres días en Recuperación; Pol, con una enfermedad desde el domingo. Biel lleva dos días con la HRV por debajo de su normal, y Arnau no tiene datos de la pulsera desde ayer.',
        fr: "5 sur 10 sont en Optimal. Martí et Pol sont en Récupération depuis trois jours ; Pol, avec une maladie depuis dimanche. Biel a la HRV sous sa normale depuis deux jours, et Arnau n'a plus de données du bracelet depuis hier.",
        en: "5 of 10 are Optimal. Martí and Pol have been in Recovery for three days; Pol, with an illness since Sunday. Biel's HRV has been below usual for two days, and Arnau has had no wearable data since yesterday." } },
    B: { h: { ca: 'Gairebé tot el grup, dins del seu normal', es: 'Casi todo el grupo, en su normal', fr: 'Presque tout le groupe dans sa normale', en: 'Almost the whole group within their usual' },
      p: { ca: "6 de 10 estan en Òptim. Abril ha entrat avui en Recuperació, amb la FC per sobre del seu normal. Laia continua amb participació reduïda per una lesió i Júlia torna aquesta setmana de la seva. La franja de Nora estarà a punt dimarts.",
        es: '6 de 10 están en Óptimo. Abril ha entrado hoy en Recuperación, con la FC por encima de su normal. Laia sigue con participación reducida por una lesión y Júlia vuelve esta semana de la suya. La franja de Nora estará lista el martes.',
        fr: "6 sur 10 sont en Optimal. Abril entre aujourd'hui en Récupération, avec la FC au-dessus de sa normale. Laia a toujours une participation réduite à cause d'une blessure et Júlia revient cette semaine de la sienne. La plage de Nora sera prête mardi.",
